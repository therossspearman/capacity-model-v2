name: Deploy to Airtable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set Airtable API Key
        run: npx @airtable/blocks-cli set-api-key ${{ secrets.AIRTABLE_API_KEY }}
      
      - name: Verify worker artifact matches source
        run: |
          cp frontend/worker/workerCode_v4.js /tmp/workerCode_v4.committed.js
          npm run build:worker
          if ! diff -q /tmp/workerCode_v4.committed.js frontend/worker/workerCode_v4.js > /dev/null; then
            echo "::error::workerCode_v4.js is out of sync with workerCodeSource.js. Run 'npm run build:worker' and commit the result."
            diff /tmp/workerCode_v4.committed.js frontend/worker/workerCode_v4.js || true
            exit 1
          fi
          echo "Worker artifact is in sync with source."

      - name: Deploy to Airtable
        run: echo "Automated deployment" | npx @airtable/blocks-cli release
