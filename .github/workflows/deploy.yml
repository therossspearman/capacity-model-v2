name: Deploy to Airtable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set Airtable API Key
        run: npx @airtable/blocks-cli set-api-key ${{ secrets.AIRTABLE_API_KEY }}
      
      - name: Build Worker Code
        run: npm run build:worker
      
      - name: Deploy to Airtable
        run: echo "Automated deployment" | npx @airtable/blocks-cli release
